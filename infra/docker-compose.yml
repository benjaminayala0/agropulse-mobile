version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Redpanda: Broker de Streaming ultra-liviano compatible con Apache Kafka
  # ----------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: agropulse_redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"     # Kafka API para host local
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redpanda Console: Interfaz Web para ver topics, particiones y eventos en vivo
  # ----------------------------------------------------------------------------
  console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: agropulse_console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:29092"

  # ----------------------------------------------------------------------------
  # Worker + Simulador IoT: Genera ticks de sensores y procesa comandos de riego
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: agropulse_worker
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKER: "redpanda:29092"
      SUPABASE_URL: "${EXPO_PUBLIC_SUPABASE_URL}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      TICK_INTERVAL_MS: "5000"

volumes:
  redpanda_data:
